<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Women's day</title>
    <style>
      body {
        margin: 0;
        background: linear-gradient(135deg, #ffdde1, #ee9ca7);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        font-family: "Poppins", sans-serif;
        overflow: hidden;
      }

      h1 {
        font-size: 28px;
        color: #660066;
        margin-bottom: 20px;
        animation: fadeIn 2s ease-in-out;
      }

      .gift {
        cursor: pointer;
        text-align: center;
        animation: bounce 1.6s ease-in-out infinite;
        transition: transform 0.3s, filter 0.3s;
        filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.65));
      }

      .gift svg {
        display: block;
        overflow: visible;
      }

      .gift .lid {
        transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        transform-origin: 120px 120px;
      }

      .gift:hover .lid {
        transform: translateY(-16px) rotate(-4deg);
      }

      /* Ánh sáng tỏa ra từ trong hộp */
      .gift .beam,
      .gift .glow {
        opacity: 0;
        transform-origin: 120px 116px;
      }

      /* Hiệu ứng mở nắp */
      .gift.open {
        animation: shake 0.45s ease-in-out;
        pointer-events: none;
      }

      .gift.open .lid {
        animation: lidFly 1.1s 0.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      }

      .gift.open .beam {
        animation: beamUp 1.2s 0.45s ease-out forwards;
      }

      .gift.open .glow {
        animation: glowPulse 1.2s 0.45s ease-out forwards;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0) rotate(0); }
        20% { transform: translateX(-6px) rotate(-3deg); }
        40% { transform: translateX(6px) rotate(3deg); }
        60% { transform: translateX(-4px) rotate(-2deg); }
        80% { transform: translateX(4px) rotate(2deg); }
      }

      @keyframes lidFly {
        0% { transform: translate(0, 0) rotate(0); opacity: 1; }
        35% { transform: translate(8px, -50px) rotate(-8deg); opacity: 1; }
        100% { transform: translate(70px, -190px) rotate(28deg); opacity: 0; }
      }

      @keyframes beamUp {
        0% { opacity: 0; transform: scaleY(0.1); }
        40% { opacity: 1; transform: scaleY(1); }
        100% { opacity: 0.85; transform: scaleY(1.15); }
      }

      @keyframes glowPulse {
        0% { opacity: 0; transform: scale(0.4); }
        50% { opacity: 1; transform: scale(1.2); }
        100% { opacity: 0.8; transform: scale(1); }
      }

      /* Tia sáng, hạt lấp lánh bắn ra */
      .spark {
        position: fixed;
        pointer-events: none;
        z-index: 50;
        animation: burst var(--dur) cubic-bezier(0.1, 0.7, 0.3, 1) forwards;
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9));
      }

      @keyframes burst {
        0% { transform: translate(0, 0) scale(0.2) rotate(0); opacity: 1; }
        70% { opacity: 1; }
        100% {
          transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot));
          opacity: 0;
        }
      }

      .flash {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, #fff 0%, rgba(255, 255, 255, 0) 60%);
        opacity: 0;
        pointer-events: none;
        z-index: 60;
        animation: flash 1s 0.9s ease-in forwards;
      }

      @keyframes flash {
        0% { opacity: 0; }
        60% { opacity: 1; }
        100% { opacity: 1; background: #fff; }
      }

      .gift:hover {
        filter: drop-shadow(0 0 30px rgba(255, 255, 255, 1));
      }

      .text {
        margin-top: 15px;
        font-size: 20px;
        color: #660066;
        font-weight: bold;
        animation: pulse 2s infinite;
      }

      /* Animasi bounce untuk hadiah */
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      /* Animasi fade in teks */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Animasi teks berdenyut */
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.8;
        }
      }

      /* Emoji confetti jatuh */
      .confetti {
        position: absolute;
        top: -50px;
        font-size: 24px;
        animation: fall linear forwards;
      }

      @keyframes fall {
        to {
          transform: translateY(110vh) rotate(360deg);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="gift" onclick="openMainPage()">
      <svg viewBox="0 0 240 250" width="240" height="250" aria-label="Hộp quà">
        <defs>
          <linearGradient id="boxBody" x1="0" x2="1">
            <stop offset="0" stop-color="#c2185b" />
            <stop offset="0.25" stop-color="#ec407a" />
            <stop offset="0.6" stop-color="#e91e63" />
            <stop offset="1" stop-color="#ad1457" />
          </linearGradient>
          <linearGradient id="boxLid" x1="0" x2="1">
            <stop offset="0" stop-color="#d81b60" />
            <stop offset="0.3" stop-color="#ff6f9c" />
            <stop offset="0.65" stop-color="#ec407a" />
            <stop offset="1" stop-color="#c2185b" />
          </linearGradient>
          <linearGradient id="ribbon" x1="0" x2="1">
            <stop offset="0" stop-color="#e0b04a" />
            <stop offset="0.35" stop-color="#fff2b8" />
            <stop offset="0.65" stop-color="#f3c969" />
            <stop offset="1" stop-color="#b8862b" />
          </linearGradient>
          <linearGradient id="ribbonH" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff2b8" />
            <stop offset="0.5" stop-color="#f3c969" />
            <stop offset="1" stop-color="#b8862b" />
          </linearGradient>
          <radialGradient id="loop" cx="0.5" cy="0.4" r="0.7">
            <stop offset="0" stop-color="#fff2b8" />
            <stop offset="0.6" stop-color="#f0c15c" />
            <stop offset="1" stop-color="#a87820" />
          </radialGradient>
          <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity="0.35" />
            <stop offset="1" stop-color="#000" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="beamGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#fff8d6" stop-opacity="0.95" />
            <stop offset="0.5" stop-color="#ffe9a8" stop-opacity="0.45" />
            <stop offset="1" stop-color="#ffe9a8" stop-opacity="0" />
          </linearGradient>
          <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#fff" stop-opacity="1" />
            <stop offset="1" stop-color="#ffe9a8" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#5a0f2c" stop-opacity="0.45" />
            <stop offset="1" stop-color="#5a0f2c" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- bóng đổ dưới sàn -->
        <ellipse class="floor-shadow" cx="120" cy="228" rx="95" ry="12" fill="url(#floor)" />

        <!-- thân hộp -->
        <rect x="42" y="116" width="156" height="108" rx="4" fill="url(#boxBody)" />
        <rect x="42" y="116" width="156" height="26" fill="url(#shade)" />
        <rect x="46" y="120" width="4" height="100" fill="#fff" opacity="0.18" />
        <!-- dải ruy băng dọc -->
        <rect x="106" y="116" width="28" height="108" fill="url(#ribbon)" />
        <rect x="106" y="116" width="28" height="22" fill="url(#shade)" />

        <!-- ánh sáng tỏa ra khi mở -->
        <path class="beam" d="M52 118 L188 118 L250 -120 L-10 -120 Z" fill="url(#beamGrad)" />
        <ellipse class="glow" cx="120" cy="116" rx="80" ry="16" fill="url(#glowGrad)" />

        <!-- nắp hộp + nơ -->
        <g class="lid">
          <rect x="32" y="86" width="176" height="36" rx="5" fill="url(#boxLid)" />
          <rect x="32" y="86" width="176" height="5" rx="2.5" fill="#fff" opacity="0.35" />
          <rect x="32" y="114" width="176" height="8" fill="#000" opacity="0.18" />
          <rect x="105" y="86" width="30" height="36" fill="url(#ribbon)" />
          <rect x="105" y="86" width="3" height="36" fill="#fff" opacity="0.4" />

          <!-- đuôi nơ -->
          <path d="M120 84 C100 96 82 112 74 128 L92 124 C98 112 110 98 120 90 Z" fill="url(#ribbon)" />
          <path d="M120 84 C140 96 158 112 166 128 L148 124 C142 112 130 98 120 90 Z" fill="url(#ribbon)" />

          <!-- hai vòng nơ -->
          <path d="M120 84 C108 50 64 38 62 64 C60 84 98 90 120 84 Z" fill="url(#loop)" />
          <path d="M120 84 C132 50 176 38 178 64 C180 84 142 90 120 84 Z" fill="url(#loop)" />
          <path d="M116 80 C104 62 80 52 72 62 C70 74 92 82 116 80 Z" fill="#a87820" opacity="0.35" />
          <path d="M124 80 C136 62 160 52 168 62 C170 74 148 82 124 80 Z" fill="#a87820" opacity="0.35" />
          <path d="M96 50 C84 50 72 56 68 62" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round" />
          <path d="M144 50 C156 50 168 56 172 62" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round" />

          <!-- nút thắt -->
          <ellipse cx="120" cy="82" rx="14" ry="12" fill="url(#loop)" />
          <ellipse cx="116" cy="78" rx="5" ry="4" fill="#fff" opacity="0.55" />
        </g>
      </svg>
    </div>


    <script>
      // Pindah ke halaman utama
      function openMainPage() {
        localStorage.setItem("playAudio", "true");
        const gift = document.querySelector(".gift");
        if (gift.classList.contains("open")) return;
        gift.classList.add("open");

        // Bắn hạt lấp lánh từ miệng hộp sau khi nắp bật lên
        setTimeout(() => {
          const r = gift.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height * 0.46;
          const items = ["✨", "⭐", "💖", "🎀", "🌸", "💫"];
          for (let i = 0; i < 36; i++) {
            const s = document.createElement("div");
            s.className = "spark";
            s.textContent = items[Math.floor(Math.random() * items.length)];
            const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.1;
            const dist = 120 + Math.random() * 260;
            s.style.left = cx + "px";
            s.style.top = cy + "px";
            s.style.fontSize = 16 + Math.random() * 20 + "px";
            s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
            s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
            s.style.setProperty("--rot", (Math.random() - 0.5) * 540 + "deg");
            s.style.setProperty("--dur", 1 + Math.random() * 0.9 + "s");
            document.body.appendChild(s);
          }
        }, 650);

        // Chớp sáng rồi chuyển trang
        const flash = document.createElement("div");
        flash.className = "flash";
        document.body.appendChild(flash);
        setTimeout(() => (window.location.href = "card.html"), 2000);
      }

      // Confetti jatuh
      const emojis = ["❤️", "✨", "🎀", "💖", "⭐"];
      setInterval(() => {
        const confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.animationDuration = 3 + Math.random() * 3 + "s";
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 6000);
      }, 500);
    </script>
  </body>
</html>
