<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Women's day💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
        font-family: "Baloo 2", "Segoe UI", sans-serif;
        background: radial-gradient(ellipse at 50% 120%, #5b1a5e 0%, #240a45 45%, #090218 100%);
      }

      #fireworks {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      /* Thẻ kính mờ ở giữa */
      .card {
        position: relative;
        z-index: 5;
        width: min(680px, 100%);
        max-height: 92vh;
        padding: clamp(26px, 5vh, 52px) clamp(22px, 5vw, 48px);
        text-align: center;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.85);
        border: 1.5px solid rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 25px 60px rgba(255, 90, 150, 0.28), inset 0 0 30px rgba(255, 255, 255, 0.5);
        animation: cardIn 1.2s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }

      @keyframes cardIn {
        from { opacity: 0; transform: translateY(40px) scale(0.92); }
      }

      /* Nơ đính trên đỉnh thẻ */
      .ribbon {
        position: absolute;
        top: calc(min(64px, 8vh) * -0.55);
        left: 50%;
        font-size: min(64px, 8vh);
        transform: translateX(-50%);
        filter: drop-shadow(0 6px 8px rgba(214, 51, 108, 0.35));
        animation: sway 3s ease-in-out infinite alternate;
      }

      @keyframes sway {
        from { transform: translateX(-50%) rotate(-6deg); }
        to { transform: translateX(-50%) rotate(6deg) scale(1.06); }
      }

      .badge {
        display: inline-block;
        margin-top: clamp(6px, 1.5vh, 14px);
        padding: 4px 18px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 3px;
        color: #fff;
        background: linear-gradient(90deg, #ff7eb3, #ff4d94);
        box-shadow: 0 4px 12px rgba(255, 77, 148, 0.4);
      }

      h1 {
        margin-top: clamp(8px, 2vh, 18px);
        font-family: "Pacifico", cursive;
        font-weight: 400;
        font-size: clamp(28px, min(7vw, 8vh), 56px);
        line-height: 1.3;
        white-space: nowrap;
        background: linear-gradient(90deg, #ff4d94, #ff8fbf, #c2185b, #ff4d94);
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 3px 6px rgba(255, 77, 148, 0.3));
        animation: shimmer 6s linear infinite;
      }

      @keyframes shimmer {
        to { background-position: -250% 0; }
      }

      .divider {
        margin: clamp(6px, 1.6vh, 14px) auto;
        font-size: 16px;
        letter-spacing: 8px;
        opacity: 0.9;
      }

      .to {
        font-size: clamp(18px, min(4.5vw, 3.4vh), 26px);
        font-weight: 700;
        color: #b03a6e;
      }

      .msg {
        margin-top: 6px;
        font-size: clamp(14px, min(3.6vw, 2.6vh), 19px);
        color: #8a5a70;
      }

      /* Nút có nhịp đập và ánh sáng quét qua */
      .cute-btn {
        position: relative;
        display: inline-block;
        margin-top: clamp(14px, 3.5vh, 30px);
        padding: clamp(10px, 1.8vh, 14px) 38px;
        border-radius: 999px;
        overflow: hidden;
        text-decoration: none;
        font-family: inherit;
        font-weight: 700;
        font-size: 19px;
        color: #fff;
        background: linear-gradient(135deg, #ff8fbf, #ff4d94);
        box-shadow: 0 8px 22px rgba(255, 77, 148, 0.5);
        animation: pulse 1.8s ease-in-out infinite;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }

      .cute-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -80%;
        width: 50%;
        height: 100%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.65), transparent);
        transform: skewX(-20deg);
        animation: shine 2.8s ease-in-out infinite;
      }

      .cute-btn:hover {
        transform: translateY(-3px) scale(1.07);
        box-shadow: 0 12px 30px rgba(255, 77, 148, 0.65);
        animation-play-state: paused;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      @keyframes shine {
        0%, 55% { left: -80%; }
        100% { left: 140%; }
      }

      audio { display: none; }
    </style>
  </head>

  <body>

    <canvas id="fireworks"></canvas>

    <div class="card">
      <div class="ribbon">🎀</div>
      <span class="badge">20 · 10</span>
      <div class="divider">✦ ✿ ✦</div>
      <p class="to">Gửi Thu Hoài 🎀</p>
      <p class="msg">Có một món quà nhỏ đang đợi nàng ở phía sau...</p>
      <a href="./flower.html" class="cute-btn">Click here</a>
    </div>

    <audio id="myAudio" autoplay loop>
      <source src="../ssstikio-1703694315342_ehaSa1Sg.mp3" type="audio/mp3" />
      Your browser does not support the audio element.
    </audio>

    <script>
      const canvas = document.getElementById("fireworks");
      const ctx = canvas.getContext("2d");
      let W, H;
      function resize() {
        const dpr = window.devicePixelRatio || 1;
        W = innerWidth;
        H = innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      addEventListener("resize", resize);

      const palette = [
        [255, 120, 180], [255, 200, 90], [255, 255, 255],
        [180, 140, 255], [120, 220, 255], [255, 90, 120],
      ];
      const rockets = [];
      const sparks = [];

      function launch(x) {
        rockets.push({
          x: x ?? W * (0.12 + Math.random() * 0.76),
          y: H,
          ty: H * (0.12 + Math.random() * 0.35),
          vy: -(7 + Math.random() * 3),
          hue: palette[Math.floor(Math.random() * palette.length)],
        });
      }

      function explode(x, y, c) {
        const n = 70 + Math.floor(Math.random() * 40);
        const second = palette[Math.floor(Math.random() * palette.length)];
        for (let i = 0; i < n; i++) {
          const t = (i / n) * Math.PI * 2;
          const sp = 1.5 + Math.random() * 4.5;
          const vx = Math.cos(t) * sp;
          const vy = Math.sin(t) * sp;
          sparks.push({
            x, y, vx, vy,
            life: 1,
            decay: 0.008 + Math.random() * 0.01,
            c: Math.random() < 0.7 ? c : second,
          });
        }
      }

      function frame() {
        // Phủ mờ để tạo vệt đuôi sáng
        ctx.globalCompositeOperation = "destination-out";
        ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
        ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = "lighter";

        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          r.y += r.vy;
          r.vy *= 0.985;
          ctx.fillStyle = "rgb(255, 235, 200)";
          ctx.beginPath();
          ctx.arc(r.x, r.y, 2, 0, 7);
          ctx.fill();
          if (r.y <= r.ty || r.vy > -1.5) {
            explode(r.x, r.y, r.hue);
            rockets.splice(i, 1);
          }
        }

        for (let i = sparks.length - 1; i >= 0; i--) {
          const p = sparks[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.975;
          p.vy = p.vy * 0.975 + 0.04;
          p.life -= p.decay;
          if (p.life <= 0) {
            sparks.splice(i, 1);
            continue;
          }
          ctx.fillStyle = `rgba(${p.c[0]}, ${p.c[1]}, ${p.c[2]}, ${p.life})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 1.2 + p.life * 1.4, 0, 7);
          ctx.fill();
        }
        requestAnimationFrame(frame);
      }
      frame();

      launch();
      setTimeout(launch, 300);
      setTimeout(launch, 700);
      setInterval(() => {
        if (rockets.length < 4) launch();
      }, 900);
      // Bấm vào nền để bắn thêm pháo hoa tại vị trí đó
      addEventListener("pointerdown", (e) => {
        if (!e.target.closest(".card")) launch(e.clientX);
      });
    </script>
  </body>
</html>
